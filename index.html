<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover" />
  <meta name="apple-mobile-web-app-capable" content="yes" />
  <meta name="theme-color" content="#050816" />
  <title>Nimbus Hop</title>
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; -webkit-tap-highlight-color: transparent; user-select: none; }
    html, body { width: 100%; height: 100%; background: #050816; overflow: hidden; font-family: "Segoe UI", system-ui, sans-serif; }
    canvas { display: block; width: 100%; height: 100%; touch-action: none; }
    #hud {
      position: fixed; inset: 0; pointer-events: none;
      color: #e8f6ff; text-align: center;
    }
    #scoreWrap {
      position: absolute; top: max(18px, env(safe-area-inset-top));
      left: 0; right: 0; font-size: 42px; font-weight: 800;
      letter-spacing: 2px; text-shadow: 0 0 18px #5cf0ff88;
    }
    #overlay {
      position: absolute; inset: 0; display: flex; flex-direction: column;
      align-items: center; justify-content: center; gap: 10px;
      background: radial-gradient(ellipse at center, #0b1230cc 0%, #050816ee 70%);
      pointer-events: none;
    }
    #overlay h1 {
      font-size: clamp(36px, 10vw, 64px); font-weight: 800;
      background: linear-gradient(180deg, #7af6ff, #c77dff);
      -webkit-background-clip: text; background-clip: text; color: transparent;
      filter: drop-shadow(0 0 16px #5cf0ff55);
    }
    #overlay p { opacity: 0.85; font-size: 16px; max-width: 280px; line-height: 1.4; }
    #overlay .best { color: #9be7ff; font-weight: 700; margin-top: 6px; }
    #overlay.hidden { display: none; }
  </style>
</head>
<body>
  <canvas id="c"></canvas>
  <div id="hud">
    <div id="scoreWrap">0</div>
    <div id="overlay">
      <h1>NIMBUS HOP</h1>
      <p>Tap to fly through the neon gates.<br/>Don't hit the walls.</p>
      <div class="best" id="bestLabel">Best 0</div>
      <p style="margin-top:18px;opacity:.7">Tap anywhere to start</p>
    </div>
  </div>
  <script>
    const canvas = document.getElementById("c");
    const ctx = canvas.getContext("2d");
    const scoreEl = document.getElementById("scoreWrap");
    const overlay = document.getElementById("overlay");
    const bestLabel = document.getElementById("bestLabel");

    let W = 0, H = 0, dpr = 1;
    function resize() {
      dpr = Math.min(window.devicePixelRatio || 1, 2);
      W = canvas.width = Math.floor(window.innerWidth * dpr);
      H = canvas.height = Math.floor(window.innerHeight * dpr);
    }
    window.addEventListener("resize", resize);
    resize();

    const STATE = { MENU: 0, PLAY: 1, OVER: 2 };
    let state = STATE.MENU;
    let score = 0;
    let best = Number(localStorage.getItem("nimbus_best") || 0);
    bestLabel.textContent = "Best " + best;

    const bird = { x: 0, y: 0, vy: 0, r: 0 };
    let gates = [];
    let stars = [];
    let particles = [];
    let t = 0;
    let speed = 0;
    let gravity = 0;
    let flap = 0;

    function resetWorld() {
      bird.x = W * 0.28;
      bird.y = H * 0.45;
      bird.vy = 0;
      bird.r = Math.max(16, Math.min(W, H) * 0.028);
      gravity = H * 0.00055;
      flap = -H * 0.0125;
      speed = W * 0.0042;
      gates = [];
      particles = [];
      score = 0;
      scoreEl.textContent = "0";
      for (let i = 0; i < 3; i++) spawnGate(W * 0.75 + i * W * 0.48);
      stars = Array.from({ length: 60 }, () => ({
        x: Math.random() * W,
        y: Math.random() * H,
        s: Math.random() * 1.8 + 0.4,
        p: Math.random() * 0.6 + 0.2
      }));
    }
    resetWorld();

    function spawnGate(x) {
      const gap = H * (0.26 - Math.min(score, 20) * 0.003);
      const margin = H * 0.12;
      const gy = margin + Math.random() * (H - gap - margin * 2);
      gates.push({ x, gapY: gy, gap, w: Math.max(52, W * 0.07), passed: false });
    }

    function startGame() {
      resetWorld();
      state = STATE.PLAY;
      overlay.classList.add("hidden");
      bird.vy = flap;
      burst(bird.x, bird.y, "#7af6ff");
    }

    function gameOver() {
      state = STATE.OVER;
      if (score > best) {
        best = score;
        localStorage.setItem("nimbus_best", String(best));
      }
      overlay.innerHTML = `
        <h1>CRASHED</h1>
        <p>Score ${score}</p>
        <div class="best">Best ${best}</div>
        <p style="margin-top:18px;opacity:.7">Tap to fly again</p>`;
      overlay.classList.remove("hidden");
      burst(bird.x, bird.y, "#ff6ad5");
    }

    function burst(x, y, color) {
      for (let i = 0; i < 22; i++) {
        const a = Math.random() * Math.PI * 2;
        const sp = Math.random() * 4 + 1;
        particles.push({ x, y, vx: Math.cos(a) * sp, vy: Math.sin(a) * sp, life: 1, color });
      }
    }

    function tap() {
      if (state === STATE.MENU || state === STATE.OVER) startGame();
      else if (state === STATE.PLAY) {
        bird.vy = flap;
        burst(bird.x - bird.r, bird.y, "#9be7ff");
      }
    }
    window.addEventListener("pointerdown", (e) => { e.preventDefault(); tap(); }, { passive: false });
    window.addEventListener("keydown", (e) => {
      if (e.code === "Space" || e.code === "ArrowUp") { e.preventDefault(); tap(); }
    });

    function loop() {
      t++;
      ctx.fillStyle = "#050816";
      ctx.fillRect(0, 0, W, H);

      const g = ctx.createRadialGradient(W * 0.5, H * 0.2, 0, W * 0.5, H * 0.5, H);
      g.addColorStop(0, "#12204a");
      g.addColorStop(1, "#050816");
      ctx.fillStyle = g;
      ctx.fillRect(0, 0, W, H);

      stars.forEach(s => {
        s.x -= speed * s.p * 0.25;
        if (s.x < 0) s.x += W;
        ctx.globalAlpha = 0.35 + s.p * 0.65;
        ctx.fillStyle = "#cfefff";
        ctx.beginPath();
        ctx.arc(s.x, s.y, s.s, 0, Math.PI * 2);
        ctx.fill();
      });
      ctx.globalAlpha = 1;

      if (state === STATE.PLAY) {
        bird.vy += gravity;
        bird.y += bird.vy;
        if (bird.y - bird.r < 0 || bird.y + bird.r > H) gameOver();

        gates.forEach(gate => {
          gate.x -= speed;
          if (!gate.passed && gate.x + gate.w < bird.x) {
            gate.passed = true;
            score++;
            scoreEl.textContent = String(score);
            speed += W * 0.00008;
          }
          const inX = bird.x + bird.r * 0.7 > gate.x && bird.x - bird.r * 0.7 < gate.x + gate.w;
          const inGap = bird.y - bird.r > gate.gapY && bird.y + bird.r < gate.gapY + gate.gap;
          if (inX && !inGap) gameOver();
        });
        gates = gates.filter(g => g.x + g.w > -40);
        if (gates.length && gates[gates.length - 1].x < W * 0.62) {
          spawnGate(gates[gates.length - 1].x + W * 0.48);
        }
      }

      gates.forEach(gate => {
        const col = ctx.createLinearGradient(gate.x, 0, gate.x + gate.w, 0);
        col.addColorStop(0, "#6a3cff");
        col.addColorStop(0.5, "#ff4fd8");
        col.addColorStop(1, "#6a3cff");
        ctx.fillStyle = col;
        ctx.shadowColor = "#ff4fd8";
        ctx.shadowBlur = 18;
        ctx.fillRect(gate.x, 0, gate.w, gate.gapY);
        ctx.fillRect(gate.x, gate.gapY + gate.gap, gate.w, H - (gate.gapY + gate.gap));
        ctx.shadowBlur = 0;
        ctx.fillStyle = "#9af6ff";
        ctx.fillRect(gate.x, gate.gapY - 6, gate.w, 6);
        ctx.fillRect(gate.x, gate.gapY + gate.gap, gate.w, 6);
      });

      particles.forEach(p => {
        p.x += p.vx; p.y += p.vy; p.vy += 0.05; p.life -= 0.025;
        ctx.globalAlpha = Math.max(0, p.life);
        ctx.fillStyle = p.color;
        ctx.beginPath();
        ctx.arc(p.x, p.y, 3, 0, Math.PI * 2);
        ctx.fill();
      });
      particles = particles.filter(p => p.life > 0);
      ctx.globalAlpha = 1;

      const wing = Math.sin(t * 0.25) * 0.4;
      ctx.save();
      ctx.translate(bird.x, bird.y);
      ctx.rotate(Math.max(-0.6, Math.min(0.8, bird.vy * 0.045)));
      ctx.shadowColor = "#7af6ff";
      ctx.shadowBlur = 22;
      ctx.fillStyle = "#7af6ff";
      ctx.beginPath();
      ctx.ellipse(0, 0, bird.r * 1.15, bird.r * 0.85, 0, 0, Math.PI * 2);
      ctx.fill();
      ctx.fillStyle = "#ff7ae6";
      ctx.beginPath();
      ctx.ellipse(-bird.r * 0.2, -bird.r * 0.15 + wing * 6, bird.r * 0.7, bird.r * 0.35, -0.6 + wing, 0, Math.PI * 2);
      ctx.fill();
      ctx.fillStyle = "#041018";
      ctx.beginPath();
      ctx.arc(bird.r * 0.45, -bird.r * 0.15, bird.r * 0.16, 0, Math.PI * 2);
      ctx.fill();
      ctx.restore();

      requestAnimationFrame(loop);
    }
    loop();
  </script>
</body>
</html>
